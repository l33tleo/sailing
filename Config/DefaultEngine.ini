[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=2
; TAA (2) beholdes som primærvalg for nå — trygt testet på Metal. TSR (4, UE5.8s nyere standard)
; bør evalueres som egen, målt A/B-test på faktisk Mac-maskinvare, ikke byttes blindt.
; Lumen AV (GI=0, refleksjoner=2/SSR). Prosjektet genererer ikke mesh distance fields, og land er
; ProceduralMeshComponent (får uansett ingen), så Lumen hadde ingen sporingsdata: skjermmeldingen
; "Lumen is enabled but has no ray tracing data", og i praksis bare skjermrom-spor. Målt i PIE:
; ingen synlig forskjell på åpent hav med SkyLight, og ingen fps-endring — men meldingen forsvinner.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
; Metal har ingen maskinvareakselerert ray tracing — Lumen kjører uansett i software-modus her;
; eksplisitt av for å dokumentere dette i stedet for å la det være implisitt.
r.Lumen.HardwareRayTracing=0
; Virtual Shadow Maps AV -> kaskadeskygger. Fjordens land er store ikke-Nanite prosedurale mesher
; som dekker enorme skyggekart-flater ("[VSM] Non-Nanite Marking Job Queue overflow"). Målt i PIE:
; ingen fps-forskjell, men advarselen forsvinner og skyggene ser like ut.
r.Shadow.Virtual.Enable=0
; Vann-sonen dekker hele Oslofjorden (~20x34 km) — standard WaterInfo-oppløsning er tunet for
; langt mindre soner og gir grovkornet skum/dybde-falloff ved kysten uten denne økningen.
r.Water.WaterInfo.RenderTargetResolutionMax=2048

