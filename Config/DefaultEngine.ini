[/Script/Engine.CollisionProfile]
; Dedikert objektkanal for vann, adskilt fra ECC_WorldStatic (som land/øyer bruker for BlockAll-
; grunnstøtingsrespons). Uten dette deler vann og land samme kanal, og CapsuleComp kan ikke ha
; ulik respons (Overlap for vann, Block for land) til to ting på samme kanal samtidig — dette var
; årsaken til at båten falt rett gjennom havoverflaten i stedet for å flyte (verifisert i PIE).
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,Name="Water",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
; Fjordens land (øyer/kystlinje) på egen objektkanal: grunnstøtingslogikken i ASailboatPawn filtrerer
; på denne i stedet for komponenttype, slik at både bakte StaticMesh-øyer og prosedural fallback
; teller som land, mens nivåets dekorative Landscape (WorldStatic) ikke gjør det.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,Name="FjordLand",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True)
+Profiles=(Name="FjordLand",CollisionEnabled=QueryAndPhysics,ObjectTypeName="FjordLand",CustomResponses=,HelpMessage="Fjordens land: blokkerer alt, egen objektkanal for grunnstøtingsfilter",bCanModify=True)
+Profiles=(Name="SailingWaterBody",CollisionEnabled=QueryOnly,ObjectTypeName="Water",CustomResponses=((Channel="Pawn",Response=ECR_Overlap),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Vehicle",Response=ECR_Overlap),(Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="Water body collision på dedikert Water-kanal (Sailing-prosjektet)",bCanModify=True)


; Inkrementell garbage collection: standard GC kjører hvert ~61. sekund og tok ~45 ms i én frame
; (målt med `stat dumphitches` i PIE = et merkbart hakk "en gang i minuttet"). Spres nå over flere
; frames med ~3 ms budsjett per frame; ingen GC-hitcher >42 ms over 3 min etterpå.
[ConsoleVariables]
gc.AllowIncrementalReachability=1
gc.AllowIncrementalGather=1
gc.IncrementalReachabilityTimeLimit=0.003
gc.IncrementalGatherTimeLimit=0.003
